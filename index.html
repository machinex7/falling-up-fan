<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Falling Up — Flight Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
  <style>

    /* ═══════════════════════════════════════════
       RESET & PALETTE
       Mobile-first: base rules target phones,
       min-width queries progressively add room.
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* dark gunmetal hull — same material front and sides, we're in space */
      --metal-hi:     #454b53;
      --metal:        #262a30;
      --metal-lo:     #15181c;
      --metal-shadow: #0a0c0e;
      --spec:         #d7dde2; /* specular highlight for bolts/knobs/levers */

      --bezel:        #17161a;
      --bezel-lo:     #08080a;

      --ink:          #ccd2d8;
      --ink-soft:     #838a92;

      --amber:        #d9861f;
      --amber-glow:   rgba(217,134,31,0.65);
      --green:        #3f8f5f;
      --green-glow:   rgba(63,143,95,0.65);
      --cyan:         #2fa8c4;
      --cyan-glow:    rgba(47,168,196,0.65);

      --led-bg:       #101214;
      --led-amber:    #ffb339;
      --led-green:    #5ee88a;
      --led-cyan:     #5fd6ee;

      --wall-w:       11%;
      --seam-w:       4px;
      --wall-tilt:    46deg;

      --font-label:   'Barlow Semi Condensed', sans-serif;
      --font-led:     'VT323', monospace;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bezel-lo);
      font-family: var(--font-label);
      color: var(--ink);
    }

    a { color: inherit; text-decoration: none; }

    /* ═══════════════════════════════════════════
       COCKPIT SHELL
    ═══════════════════════════════════════════ */
    #cockpit {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }

    /* ── thin mission plaque ── */
    #plaque-bar {
      flex: 0 0 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(180deg, var(--bezel) 0%, var(--bezel-lo) 100%);
      border-bottom: 2px solid var(--bezel-lo);
    }

    .plaque {
      font-size: 0.56rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .rivet {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--spec), var(--metal-lo) 70%, var(--bezel-lo) 100%);
      box-shadow: 0 0 0 1px var(--bezel-lo);
      flex: none;
    }

    /* ── the hull row: left wall / forward wall / right wall ── */
    #shell {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: stretch;
      perspective: 500px;
    }

    /* shared hull-plate skin */
    .hull {
      background: linear-gradient(180deg, var(--metal-hi) 0%, var(--metal) 45%, var(--metal-lo) 100%);
    }

    /* ── seams between plates ── */
    .seam {
      flex: 0 0 var(--seam-w);
      background: linear-gradient(180deg, var(--bezel-lo), var(--bezel) 50%, var(--bezel-lo));
      z-index: 3;
    }

    /* ── side walls (narrow always, tilt away in 3D) ── */
    .wall {
      flex: 0 0 var(--wall-w);
      min-width: 22px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      transform-style: preserve-3d;
      overflow: hidden;
      /* same hull material as the front, just dimmer — out of the window light, in vacuum shadow */
      filter: brightness(0.62);
    }

    .wall.left  { transform-origin: right center; transform: rotateY(var(--wall-tilt)); }
    .wall.right { transform-origin: left center;  transform: rotateY(calc(-1 * var(--wall-tilt))); }

    /* depth-shading so the receding edge reads even darker */
    .wall::before {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .wall.left::before  { background: linear-gradient(90deg, rgba(0,0,0,0.55), transparent 70%); }
    .wall.right::before { background: linear-gradient(270deg, rgba(0,0,0,0.55), transparent 70%); }

    .conduit {
      width: 7px;
      flex: 1 1 auto;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--metal-shadow), var(--metal-hi) 45%, var(--metal-shadow));
      box-shadow: inset 0 0 2px rgba(0,0,0,0.6);
    }

    .wall-light {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px 1px var(--amber-glow);
      animation: lamp-pulse 3.6s ease-in-out infinite;
      flex: none;
    }

    .wall-extra {
      display: none; /* revealed at wider breakpoints */
    }

    .knob-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    /* ── forward wall: window over console ── */
    #forward {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* ═══════════════════════════════════════════
       WINDOW
    ═══════════════════════════════════════════ */
    #window {
      flex: 1 1 54%;
      min-height: 0;
      position: relative;
      margin: 8px 8px 6px;
      border-radius: 10px;
      border: 7px solid var(--bezel);
      box-shadow:
        0 0 0 2px var(--bezel-lo),
        inset 0 0 30px rgba(0,0,0,0.7);
      background: #05060a;
      overflow: hidden;
    }

    #window canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .bolt {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--spec), var(--metal-lo) 70%, var(--bezel-lo) 100%);
      box-shadow: 0 0 0 1px var(--bezel-lo), inset 0 0 2px rgba(0,0,0,0.5);
      z-index: 4;
    }
    .bolt.tl { top: 6px; left: 6px; }
    .bolt.tr { top: 6px; right: 6px; }
    .bolt.bl { bottom: 6px; left: 6px; }
    .bolt.br { bottom: 6px; right: 6px; }

    .hud {
      position: absolute;
      font-family: var(--font-led);
      font-size: clamp(0.62rem, 2vw, 0.95rem);
      letter-spacing: 0.06em;
      color: rgba(217,134,31,0.55);
      line-height: 1.4;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 3;
    }
    .hud.tl { top: 10px; left: 14px; max-width: 46%; }
    .hud.tr { top: 10px; right: 14px; text-align: right; max-width: 46%; }
    .hud.bl { bottom: 10px; left: 14px; max-width: 46%; }
    .hud.br { bottom: 10px; right: 14px; text-align: right; max-width: 46%; }

    #reticle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      opacity: 0.3;
      pointer-events: none;
      width: clamp(40px, 12vw, 70px);
      height: auto;
    }

    /* ═══════════════════════════════════════════
       CONSOLE — tilted back like a dash angled up
       toward the pilot: base near/wide, top far/narrow
    ═══════════════════════════════════════════ */
    #console {
      flex: 1 1 46%;
      min-height: 0;
      margin: 0 8px 8px;
      padding: 9px;
      border-radius: 8px;
      /* .hull supplies the same base gradient as the side walls — this is the front of that material */
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.4), 0 14px 18px rgba(0,0,0,0.5);
      transform: perspective(2000px) rotateX(9deg);
      transform-origin: bottom center;
    }

    /* ── the deck: a fine-grained CSS Grid, not a table.
       A real <table> was tempting for row/colspan, but table columns
       share one width across every row (widest cell in that column
       wins, globally) — that's exactly the "neat aligned grid" look
       we just tore out. CSS Grid gives the same spanning ability
       (grid-column/grid-row: span N below) without that forced
       alignment: 24 slim columns act as a coordinate system, items
       claim as many as their content needs, and `dense` packing lets
       later items fill gaps left by earlier ones instead of forcing
       new rows. Columns are capped at 44px (not 1fr) so they stay
       content-sized instead of stretching to fill wide desktop
       screens — that stretch is what turned small controls into
       widely-spaced islands earlier. ── */
    #deck-grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 40px));
      grid-auto-rows: minmax(0, 1fr);
      grid-auto-flow: dense;
      gap: 8px 6px;
    }

    /* future multi-cell controls: add alongside a tile's other classes */
    .span-3  { grid-column: span 3; }
    .span-4  { grid-column: span 4; }
    .span-6  { grid-column: span 6; }
    .span-8  { grid-column: span 8; }
    .rowspan-2 { grid-row: span 2; }
    .rowspan-3 { grid-row: span 3; }

    /* just a layout wrapper now (control + caption) — sized to its
       own content, not a uniform card, so the deck stays cluttered
       and uneven rather than reading as a spreadsheet of tiles */
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      grid-column: span 2;
      text-decoration: none;
      color: inherit;
    }

    .tile.readout, .tile.nav-tile { grid-column: span 4; }

    /* invisible touch-target padding — no visible box, but a bigger
       hit area, since the 3D tilt shifts a small control's rendered
       position enough that a tight box can miss its own click point */
    .tile:has(.knob), .tile:has(.toggle), .tile.nav-tile {
      cursor: pointer;
      padding: 6px 7px;
      margin: -6px -7px;
    }

    .tile-label {
      font-size: clamp(0.32rem, 1.4vw, 0.44rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    /* readout — bare glowing digits, no housing */
    .tile.readout .r-value {
      font-family: var(--font-led);
      font-size: clamp(0.85rem, 3.8vw, 1.3rem);
      line-height: 1;
    }
    .tile.readout.c-amber .r-value { color: var(--led-amber); text-shadow: 0 0 6px var(--amber-glow); }
    .tile.readout.c-green .r-value { color: var(--led-green); text-shadow: 0 0 6px var(--green-glow); }

    /* nav tile — the real links, flagged only by their lamp, sized to their label */
    .tile.nav-tile {
      cursor: pointer;
      transition: filter 0.08s ease, transform 0.08s ease;
    }
    .tile.nav-tile:hover { filter: brightness(1.4); }
    .tile.nav-tile:active { transform: translateY(2px); }
    .tile.nav-tile .tile-label {
      color: var(--ink);
      font-weight: 700;
      font-size: clamp(0.44rem, 2vw, 0.62rem);
    }

    .nav-lamp {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px 1px var(--amber-glow);
      animation: lamp-pulse 3.4s ease-in-out infinite;
      flex: none;
    }

    /* gauge tile */
    .tile.gauge svg { width: clamp(26px, 7vw, 40px); height: auto; }

    /* equalizer tile */
    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: clamp(16px, 5vw, 24px);
    }
    .eq-bar {
      width: 3px;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(180deg, var(--led-amber), var(--amber));
      animation: eq-bounce 1.1s ease-in-out infinite;
    }

    /* knob tile */
    .knob {
      width: clamp(20px, 5.5vw, 28px);
      height: clamp(20px, 5.5vw, 28px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--spec), var(--metal-lo) 65%, var(--metal-shadow) 100%);
      border: 1px solid var(--bezel);
      box-shadow: 0 2px 3px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.5);
      position: relative;
      cursor: pointer;
    }
    .knob::before {
      content: '';
      position: absolute;
      top: 3px; left: 50%;
      width: 2px; height: 8px;
      background: var(--bezel);
      transform: translateX(-50%);
      border-radius: 2px;
    }

    /* toggle tile */
    .toggle {
      width: 15px; height: 22px;
      border-radius: 3px;
      background: var(--bezel-lo);
      border: 1px solid var(--bezel);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.7);
      position: relative;
      cursor: pointer;
    }
    .toggle-lever {
      position: absolute;
      left: 2px; right: 2px;
      height: 8px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--spec), var(--metal-lo));
      box-shadow: 0 2px 3px rgba(0,0,0,0.5);
      top: 2px;
      transition: top 0.12s ease;
    }
    .toggle.is-on .toggle-lever { top: 12px; }

    .toggle-led {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--bezel-lo);
      box-shadow: inset 0 0 2px rgba(0,0,0,0.8);
    }
    .tile.is-on .toggle-led { background: var(--led-green); box-shadow: 0 0 5px var(--green-glow); }

    /* ═══════════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════════ */
    @keyframes lamp-pulse {
      0%, 60%, 100% { opacity: 1; }
      68% { opacity: 0.2; }
      74% { opacity: 0.9; }
      80% { opacity: 0.2; }
    }

    @keyframes eq-bounce {
      0%, 100% { height: 18%; }
      50%      { height: 100%; }
    }

    @keyframes gauge-fill-cyan {
      from { stroke-dasharray: 0 163.4; }
      to   { stroke-dasharray: 83.3 80.1; }
    }

    @keyframes gauge-fill-green {
      from { stroke-dasharray: 0 163.4; }
      to   { stroke-dasharray: 115.2 48.2; }
    }

    @keyframes gauge-fill-amber {
      from { stroke-dasharray: 0 163.4; }
      to   { stroke-dasharray: 99.2 64.2; }
    }

    /* ═══════════════════════════════════════════
       PROGRESSIVE ENHANCEMENT — targets modern
       phones and up; more room brings more deck
    ═══════════════════════════════════════════ */

    /* tablets/desktop: fixed-width walls with fuller instrument clusters */
    @media (min-width: 900px) {
      :root { --wall-w: 150px; --wall-tilt: 26deg; --seam-w: 6px; }
      #plaque-bar { flex-basis: 32px; }
      .plaque { font-size: 0.68rem; }
      #forward { max-width: 1040px; margin: 0 auto; }
      .wall-extra.tier2 { display: flex; }
      .side-label { display: block; }
    }

    .side-label {
      display: none;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-align: center;
    }

  </style>
</head>
<body>

<div id="cockpit">

  <!-- ═══ PLAQUE BAR ═══ -->
  <div id="plaque-bar">
    <div class="rivet"></div>
    <div class="plaque">Falling Up · Flight Deck</div>
    <div class="rivet"></div>
  </div>

  <!-- ═══ HULL ═══ -->
  <div id="shell">

    <!-- LEFT WALL -->
    <div class="wall hull left">
      <div class="wall-light"></div>
      <div class="side-label">Pwr</div>
      <div class="wall-extra tier2">
        <div class="knob-unit">
          <div class="knob" style="transform:rotate(-35deg)"></div>
          <div class="side-label">Main</div>
        </div>
      </div>
      <div class="conduit"></div>
      <div class="wall-light" style="animation-delay:1.4s;"></div>
    </div>

    <div class="seam"></div>

    <!-- FORWARD WALL: window + console -->
    <div id="forward">

      <div id="window">
        <div class="bolt tl"></div>
        <div class="bolt tr"></div>
        <div class="bolt bl"></div>
        <div class="bolt br"></div>

        <canvas id="starfield"></canvas>

        <div class="hud tl">Heading 227.4&deg;<br>Drift 0.001 AU/HR</div>
        <div class="hud tr">Range: Deep Field<br>Signal: Locked</div>
        <div class="hud bl">Proximity: Clear</div>
        <div class="hud br">Waypoint: Deep Station &alpha;</div>

        <svg id="reticle" viewBox="0 0 70 70">
          <circle cx="35" cy="35" r="32" fill="none" stroke="#d9861f" stroke-width="0.6"/>
          <line x1="35" y1="0"  x2="35" y2="28" stroke="#d9861f" stroke-width="0.6"/>
          <line x1="35" y1="42" x2="35" y2="70" stroke="#d9861f" stroke-width="0.6"/>
          <line x1="0"  y1="35" x2="28" y2="35" stroke="#d9861f" stroke-width="0.6"/>
          <line x1="42" y1="35" x2="70" y2="35" stroke="#d9861f" stroke-width="0.6"/>
          <circle cx="35" cy="35" r="3.5" fill="none" stroke="#d9861f" stroke-width="0.7"/>
        </svg>
      </div>

      <div id="console" class="hull">
        <div id="deck-grid">

          <!-- row 1: readouts + gauges -->
          <div class="tile readout c-amber">
            <div class="r-value" id="ro-power">072%</div>
            <div class="tile-label">Power</div>
          </div>
          <div class="tile readout c-green">
            <div class="r-value" id="ro-signal">090%</div>
            <div class="tile-label">Signal</div>
          </div>
          <div class="tile readout c-amber">
            <div class="r-value" id="ro-hull">100%</div>
            <div class="tile-label">Hull</div>
          </div>
          <div class="tile gauge">
            <svg viewBox="0 0 68 68">
              <g transform="rotate(135 34 34)">
                <circle cx="34" cy="34" r="26" fill="none" stroke="#0f3a44" stroke-width="5" stroke-dasharray="122.5 40.9" stroke-linecap="round"/>
                <circle cx="34" cy="34" r="26" fill="none" stroke="var(--cyan)" stroke-width="5" stroke-dasharray="0 163.4" stroke-linecap="round"
                  style="animation: gauge-fill-cyan 1.4s cubic-bezier(0.4,0,0.2,1) 0.3s forwards;"/>
              </g>
              <text x="34" y="39" text-anchor="middle" fill="var(--led-cyan)" font-family="VT323" font-size="15">68%</text>
            </svg>
            <div class="tile-label">Thrust</div>
          </div>
          <div class="tile gauge">
            <svg viewBox="0 0 68 68">
              <g transform="rotate(135 34 34)">
                <circle cx="34" cy="34" r="26" fill="none" stroke="#123522" stroke-width="5" stroke-dasharray="122.5 40.9" stroke-linecap="round"/>
                <circle cx="34" cy="34" r="26" fill="none" stroke="var(--green)" stroke-width="5" stroke-dasharray="0 163.4" stroke-linecap="round"
                  style="animation: gauge-fill-green 1.4s cubic-bezier(0.4,0,0.2,1) 0.6s forwards;"/>
              </g>
              <text x="34" y="39" text-anchor="middle" fill="var(--led-green)" font-family="VT323" font-size="15">94%</text>
            </svg>
            <div class="tile-label">O2</div>
          </div>

          <!-- row 2: the real links + more instruments -->
          <a href="members.html" class="tile nav-tile">
            <div class="nav-lamp"></div>
            <div class="tile-label">Members</div>
          </a>
          <a href="tracks.html" class="tile nav-tile">
            <div class="nav-lamp" style="animation-delay:1.1s"></div>
            <div class="tile-label">Tracks</div>
          </a>
          <a href="connections.html" class="tile nav-tile">
            <div class="nav-lamp" style="animation-delay:2.2s"></div>
            <div class="tile-label">Connections</div>
          </a>
          <div class="tile">
            <div class="eq-bars">
              <div class="eq-bar" style="animation-duration:0.9s; animation-delay:-0.1s;"></div>
              <div class="eq-bar" style="animation-duration:1.3s; animation-delay:-0.6s;"></div>
              <div class="eq-bar" style="animation-duration:0.8s; animation-delay:-0.3s;"></div>
              <div class="eq-bar" style="animation-duration:1.1s; animation-delay:-0.8s;"></div>
              <div class="eq-bar" style="animation-duration:1.4s; animation-delay:-0.2s;"></div>
            </div>
            <div class="tile-label">Audio</div>
          </div>
          <div class="tile gauge">
            <svg viewBox="0 0 68 68">
              <g transform="rotate(135 34 34)">
                <circle cx="34" cy="34" r="26" fill="none" stroke="#3a2408" stroke-width="5" stroke-dasharray="122.5 40.9" stroke-linecap="round"/>
                <circle cx="34" cy="34" r="26" fill="none" stroke="var(--amber)" stroke-width="5" stroke-dasharray="0 163.4" stroke-linecap="round"
                  style="animation: gauge-fill-amber 1.4s cubic-bezier(0.4,0,0.2,1) 0.9s forwards;"/>
              </g>
              <text x="34" y="39" text-anchor="middle" fill="var(--led-amber)" font-family="VT323" font-size="15">81%</text>
            </svg>
            <div class="tile-label">Fuel</div>
          </div>

          <!-- row 3: knobs -->
          <div class="tile">
            <div class="knob" style="transform:rotate(10deg)"></div>
            <div class="tile-label">Nav</div>
          </div>
          <div class="tile">
            <div class="knob" style="transform:rotate(-70deg)"></div>
            <div class="tile-label">Comm</div>
          </div>
          <div class="tile">
            <div class="knob" style="transform:rotate(90deg)"></div>
            <div class="tile-label">Gain</div>
          </div>
          <div class="tile">
            <div class="knob" style="transform:rotate(140deg)"></div>
            <div class="tile-label">Freq</div>
          </div>
          <div class="tile">
            <div class="knob" style="transform:rotate(-20deg)"></div>
            <div class="tile-label">Scan</div>
          </div>

          <!-- row 4: toggles -->
          <div class="tile is-on">
            <div class="toggle-led"></div>
            <div class="toggle is-on"><div class="toggle-lever"></div></div>
            <div class="tile-label">Auto</div>
          </div>
          <div class="tile">
            <div class="toggle-led"></div>
            <div class="toggle"><div class="toggle-lever"></div></div>
            <div class="tile-label">Beacon</div>
          </div>
          <div class="tile is-on">
            <div class="toggle-led"></div>
            <div class="toggle is-on"><div class="toggle-lever"></div></div>
            <div class="tile-label">Shield</div>
          </div>
          <div class="tile is-on">
            <div class="toggle-led"></div>
            <div class="toggle is-on"><div class="toggle-lever"></div></div>
            <div class="tile-label">Cabin Lt</div>
          </div>
          <div class="tile">
            <div class="toggle-led"></div>
            <div class="toggle"><div class="toggle-lever"></div></div>
            <div class="tile-label">Nav Lt</div>
          </div>

        </div>
      </div>
    </div>

    <div class="seam"></div>

    <!-- RIGHT WALL -->
    <div class="wall hull right">
      <div class="wall-light" style="animation-delay:0.8s;"></div>
      <div class="side-label">Nav</div>
      <div class="wall-extra tier2">
        <div class="knob-unit">
          <div class="knob" style="transform:rotate(140deg)"></div>
          <div class="side-label">Freq</div>
        </div>

<script>
// ═══════════════════════════════════════════════════════
// STARFIELD — canvas lives inside the window, sized to it
// ═══════════════════════════════════════════════════════
(function () {
  const win = document.getElementById('window');
  const cv = document.getElementById('starfield');
  const cx = cv.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = cv.width  = win.clientWidth;
    H = cv.height = win.clientHeight;
  }

  function makeStars() {
    stars = [];
    const n = Math.round(W * H / 1800);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.2,
        base: Math.random() * 0.7 + 0.15,
        freq: Math.random() * 0.014 + 0.003,
        phase: Math.random() * Math.PI * 2,
        vx: (Math.random() - 0.5) * 0.012,
      });
    }
  }

  let tick = 0;
  function frame() {
    cx.fillStyle = '#05060a';
    cx.fillRect(0, 0, W, H);

    tick++;
    for (const s of stars) {
      const t = Math.sin(tick * s.freq + s.phase);
      const a = s.base * (0.6 + 0.4 * t);
      cx.beginPath();
      cx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(220,225,235,${a})`;
      cx.fill();
      s.x += s.vx;
      if (s.x < 0) s.x = W;
      if (s.x > W) s.x = 0;
    }
    requestAnimationFrame(frame);
  }

  const ro = new ResizeObserver(() => { resize(); makeStars(); });
  ro.observe(win);
  resize();
  makeStars();
  frame();
})();

// ═══════════════════════════════════════════════════════
// TACTILE CONTROLS — toggles click on/off, knobs click-turn
// Bound to the whole .tile (not just the small inner shape): the
// console is tilted in 3D, so a tiny knob/toggle's painted position
// can drift from its layout center enough that point-hit-testing
// misses it — the full tile is a reliable, larger target either way.
// ═══════════════════════════════════════════════════════
(function () {
  document.querySelectorAll('.tile').forEach(tile => {
    const toggle = tile.querySelector('.toggle');
    if (toggle) {
      tile.addEventListener('click', () => {
        toggle.classList.toggle('is-on');
        tile.classList.toggle('is-on', toggle.classList.contains('is-on'));
      });
      return;
    }
    const knob = tile.querySelector('.knob');
    if (knob) {
      tile.addEventListener('click', () => {
        const current = knob.style.transform.match(/-?\d+/);
        const deg = current ? parseInt(current[0], 10) : 0;
        knob.style.transform = `rotate(${deg + 45}deg)`;
      });
    }
  });
})();

// ═══════════════════════════════════════════════════════
// READOUT DRIFT — small live-feeling number nudges
// ═══════════════════════════════════════════════════════
(function () {
  const ids = ['ro-power', 'ro-signal', 'ro-hull'];
  setInterval(() => {
    const id = ids[Math.floor(Math.random() * ids.length)];
    const el = document.getElementById(id);
    if (!el) return;
    let val = parseInt(el.textContent, 10);
    val += Math.random() > 0.5 ? 1 : -1;
    val = Math.max(60, Math.min(100, val));
    el.textContent = String(val).padStart(3, '0') + '%';
  }, 2600);
})();
</script>
</body>
