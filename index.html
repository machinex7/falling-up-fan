<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falling Up — Fan Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>

    :root {
      --bg:          #0b0c10;
      --surface:     #131419;
      --border:      #23252d;
      --text:        #e8e9ee;
      --text-dim:    #8b8d9a;
      --accent:      #7dd3c0;
      --accent-dim:  rgba(125, 211, 192, 0.14);
      --font-head:   'Space Grotesk', system-ui, sans-serif;
      --font-mono:   'IBM Plex Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-head);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── header ── */
    header {
      padding: 2.5rem 2rem 1rem;
      text-align: center;
    }

    .wordmark {
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .tagline {
      margin-top: 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* ── main ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    nav.links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 900px;
    }

    .link-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 1.75rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }

    .link-card:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: translateY(-2px);
    }

    .link-card .label {
      font-size: 1.15rem;
      font-weight: 500;
    }

    .link-card .desc {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .link-card .status {
      margin-top: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.75;
    }

    /* ── footer ── */
    footer {
      padding: 1.5rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    footer a {
      color: inherit;
    }

  </style>
</head>
<body>

  <header>
    <div class="wordmark">Falling Up</div>
    <div class="tagline">Fan Archive &amp; Companion</div>
  </header>

  <main>
    <nav class="links">
      <a href="members.html" class="link-card">
        <span class="label">Members</span>
        <span class="desc">The people behind the band</span>
        <span class="status">In progress</span>
      </a>

      <a href="tracks.html" class="link-card">
        <span class="label">Tracks</span>
        <span class="desc">Discography, lyrics &amp; notes</span>
        <span class="status">In progress</span>
      </a>

      <a href="connections.html" class="link-card">
        <span class="label">Connections</span>
        <span class="desc">Community &amp; related links</span>
        <span class="status">In progress</span>
      </a>
    </nav>
  </main>

  <footer>
    A fan-made project &middot; not affiliated with Falling Up
  </footer>

</body>
</html>
