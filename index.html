<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Falling Up — Flight Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
  <style>

    /* ═══════════════════════════════════════════
       RESET & PALETTE
       Mobile-first: base rules target phones,
       min-width queries progressively add room.
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --metal-hi:     #efe9db;
      --metal:        #cec5b0;
      --metal-lo:     #a89d87;
      --metal-shadow: #756a58;

      --bezel:        #2a2721;
      --bezel-lo:     #16140f;

      --ink:          #2c2820;
      --ink-soft:     #5b5346;

      --amber:        #d9861f;
      --amber-glow:   rgba(217,134,31,0.65);
      --green:        #3f8f5f;
      --green-glow:   rgba(63,143,95,0.65);

      --led-bg:       #131310;
      --led-amber:    #ffb339;
      --led-green:    #5ee88a;

      --wall-w:       11%;
      --seam-w:       4px;
      --wall-tilt:    46deg;

      --font-label:   'Barlow Semi Condensed', sans-serif;
      --font-led:     'VT323', monospace;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bezel-lo);
      font-family: var(--font-label);
      color: var(--ink);
    }

    a { color: inherit; text-decoration: none; }

    /* ═══════════════════════════════════════════
       COCKPIT SHELL
    ═══════════════════════════════════════════ */
    #cockpit {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }

    /* ── thin mission plaque ── */
    #plaque-bar {
      flex: 0 0 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(180deg, var(--bezel) 0%, var(--bezel-lo) 100%);
      border-bottom: 2px solid var(--bezel-lo);
    }

    .plaque {
      font-size: 0.56rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--metal);
    }

    .rivet {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--metal-hi), var(--metal-lo) 70%, var(--bezel-lo) 100%);
      box-shadow: 0 0 0 1px var(--bezel-lo);
      flex: none;
    }

    /* ── the hull row: left wall / forward wall / right wall ── */
    #shell {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: stretch;
      perspective: 500px;
    }

    /* shared hull-plate skin */
    .hull {
      background: linear-gradient(180deg, var(--metal-hi) 0%, var(--metal) 45%, var(--metal-lo) 100%);
    }

    /* ── seams between plates ── */
    .seam {
      flex: 0 0 var(--seam-w);
      background: linear-gradient(180deg, var(--bezel-lo), var(--bezel) 50%, var(--bezel-lo));
      z-index: 3;
    }

    /* ── side walls (narrow always, tilt away in 3D) ── */
    .wall {
      flex: 0 0 var(--wall-w);
      min-width: 22px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      transform-style: preserve-3d;
      overflow: hidden;
    }

    .wall.left  { transform-origin: right center; transform: rotateY(var(--wall-tilt)); }
    .wall.right { transform-origin: left center;  transform: rotateY(calc(-1 * var(--wall-tilt))); }

    /* depth-shading so the receding edge reads darker */
    .wall::before {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .wall.left::before  { background: linear-gradient(90deg, rgba(0,0,0,0.35), transparent 70%); }
    .wall.right::before { background: linear-gradient(270deg, rgba(0,0,0,0.35), transparent 70%); }

    .conduit {
      width: 7px;
      flex: 1 1 auto;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--metal-shadow), var(--metal-hi) 45%, var(--metal-shadow));
      box-shadow: inset 0 0 2px rgba(0,0,0,0.6);
    }

    .wall-light {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px 1px var(--amber-glow);
      animation: lamp-pulse 3.6s ease-in-out infinite;
      flex: none;
    }

    .wall-extra {
      display: none; /* revealed at wider breakpoints */
    }

    /* ── forward wall: window over console ── */
    #forward {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* ═══════════════════════════════════════════
       WINDOW
    ═══════════════════════════════════════════ */
    #window {
      flex: 1 1 54%;
      min-height: 0;
      position: relative;
      margin: 8px 8px 6px;
      border-radius: 10px;
      border: 7px solid var(--bezel);
      box-shadow:
        0 0 0 2px var(--bezel-lo),
        inset 0 0 30px rgba(0,0,0,0.7);
      background: #05060a;
      overflow: hidden;
    }

    #window canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .bolt {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--metal-hi), var(--metal-lo) 70%, var(--bezel-lo) 100%);
      box-shadow: 0 0 0 1px var(--bezel-lo), inset 0 0 2px rgba(0,0,0,0.5);
      z-index: 4;
    }
    .bolt.tl { top: 6px; left: 6px; }
    .bolt.tr { top: 6px; right: 6px; }
    .bolt.bl { bottom: 6px; left: 6px; }
    .bolt.br { bottom: 6px; right: 6px; }

    .hud {
      position: absolute;
      font-family: var(--font-led);
      font-size: clamp(0.62rem, 2vw, 0.95rem);
      letter-spacing: 0.06em;
      color: rgba(217,134,31,0.55);
      line-height: 1.4;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 3;
    }
    .hud.tl { top: 10px; left: 14px; max-width: 46%; }
    .hud.tr { top: 10px; right: 14px; text-align: right; max-width: 46%; }
    .hud.bl { bottom: 10px; left: 14px; display: none; }
    .hud.br { bottom: 10px; right: 14px; text-align: right; display: none; }

    #reticle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      opacity: 0.3;
      pointer-events: none;
      width: clamp(40px, 12vw, 70px);
      height: auto;
    }

    /* ═══════════════════════════════════════════
       CONSOLE
    ═══════════════════════════════════════════ */
    #console {
      flex: 1 1 46%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      margin: 0 8px 8px;
      padding: 8px 10px 10px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.14));
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
    }

    /* LED readouts */
    #readouts {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .readout {
      flex: 1;
      min-width: 0;
      background: var(--led-bg);
      border-radius: 4px;
      border: 2px solid var(--bezel);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
      padding: 2px 6px 1px;
    }

    .readout .r-label {
      font-size: 0.4rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7a7160;
    }

    .readout .r-value {
      font-family: var(--font-led);
      font-size: clamp(0.85rem, 3.6vw, 1.3rem);
      line-height: 1.05;
    }

    .readout.c-amber .r-value { color: var(--led-amber); text-shadow: 0 0 8px var(--amber-glow); }
    .readout.c-green .r-value { color: var(--led-green); text-shadow: 0 0 8px var(--green-glow); }

    /* nav buttons — the real links, always the star of the console */
    #nav-row {
      display: flex;
      gap: 8px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .nav-btn {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 6px;
      background: linear-gradient(180deg, #3a352c 0%, #211e18 100%);
      border: 2px solid var(--bezel-lo);
      box-shadow: 0 3px 0 #0a0906, 0 6px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .nav-btn:hover { filter: brightness(1.08); }

    .nav-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #0a0906, 0 2px 4px rgba(0,0,0,0.5);
    }

    .nav-lamp {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px 1px var(--amber-glow);
      animation: lamp-pulse 3.4s ease-in-out infinite;
      flex: none;
    }

    .nav-btn .nav-label {
      font-size: clamp(0.62rem, 3vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--metal-hi);
      white-space: nowrap;
    }

    .nav-btn .nav-sub {
      font-family: var(--font-led);
      font-size: clamp(0.6rem, 2.6vw, 0.85rem);
      letter-spacing: 0.03em;
      color: #b7ac95;
      display: none;
    }

    /* knob / toggle row — hidden on the smallest screens, appears as room allows */
    #control-row {
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      flex: 0 0 auto;
    }

    .knob-cluster, .toggle-cluster { display: flex; gap: 10px; }
    .knob-unit, .toggle-unit { display: flex; flex-direction: column; align-items: center; gap: 3px; }

    .knob {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--metal-hi), var(--metal-lo) 65%, var(--metal-shadow) 100%);
      border: 1px solid var(--bezel);
      box-shadow: 0 2px 3px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.6);
      position: relative;
      cursor: pointer;
    }
    .knob::before {
      content: '';
      position: absolute;
      top: 3px; left: 50%;
      width: 2px; height: 10px;
      background: var(--bezel);
      transform: translateX(-50%);
      border-radius: 2px;
    }

    .knob-label {
      font-size: 0.42rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .toggle {
      width: 18px; height: 28px;
      border-radius: 3px;
      background: var(--bezel-lo);
      border: 1px solid var(--bezel);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.7);
      position: relative;
      cursor: pointer;
    }
    .toggle-lever {
      position: absolute;
      left: 2px; right: 2px;
      height: 11px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--metal-hi), var(--metal-lo));
      box-shadow: 0 2px 3px rgba(0,0,0,0.5);
      top: 2px;
      transition: top 0.12s ease;
    }
    .toggle.is-on .toggle-lever { top: 15px; }

    .toggle-led {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--bezel-lo);
      box-shadow: inset 0 0 2px rgba(0,0,0,0.8);
    }
    .toggle-unit.is-on .toggle-led { background: var(--led-green); box-shadow: 0 0 5px var(--green-glow); }

    /* ═══════════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════════ */
    @keyframes lamp-pulse {
      0%, 60%, 100% { opacity: 1; }
      68% { opacity: 0.2; }
      74% { opacity: 0.9; }
      80% { opacity: 0.2; }
    }

    /* ═══════════════════════════════════════════
       PROGRESSIVE ENHANCEMENT — more room, more deck
    ═══════════════════════════════════════════ */

    /* small phones in landscape / large phones: show sub-labels + wall lights */
    @media (min-width: 420px) {
      .nav-btn .nav-sub { display: block; }
      .wall-extra.tier1 { display: block; }
    }

    /* small tablets: bring back the knob/toggle row */
    @media (min-width: 640px) {
      :root { --wall-w: 13%; --wall-tilt: 38deg; }
      #control-row { display: flex; }
      .hud.bl, .hud.br { display: block; }
    }

    /* tablets/desktop: fixed-width walls with fuller instrument clusters */
    @media (min-width: 900px) {
      :root { --wall-w: 150px; --wall-tilt: 26deg; --seam-w: 6px; }
      #plaque-bar { flex-basis: 32px; }
      .plaque { font-size: 0.68rem; }
      #forward { max-width: 1040px; margin: 0 auto; }
      .wall-extra.tier2 { display: flex; }
      .side-label { display: block; }
    }

    .side-label {
      display: none;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-align: center;
    }

  </style>
</head>
<body>

<div id="cockpit">

  <!-- ═══ PLAQUE BAR ═══ -->
  <div id="plaque-bar">
    <div class="rivet"></div>
    <div class="plaque">Falling Up · Flight Deck</div>
    <div class="rivet"></div>
  </div>

  <!-- ═══ HULL ═══ -->
  <div id="shell">

    <!-- LEFT WALL -->
    <div class="wall hull left">
      <div class="wall-light"></div>
      <div class="side-label">Pwr</div>
      <div class="wall-extra tier2">
        <div class="knob-unit">
          <div class="knob" style="transform:rotate(-35deg)"></div>
          <div class="knob-label">Main</div>
        </div>
      </div>
      <div class="conduit"></div>
      <div class="wall-extra tier1 wall-light" style="animation-delay:1.4s;"></div>
    </div>

    <div class="seam"></div>

    <!-- FORWARD WALL: window + console -->
    <div id="forward">

      <div id="window">
        <div class="bolt tl"></div>
        <div class="bolt tr"></div>
        <div class="bolt bl"></div>
        <div class="bolt br"></div>

        <canvas id="starfield"></canvas>

        <div class="hud tl">Heading 227.4&deg;<br>Drift 0.001 AU/HR</div>
        <div class="hud tr">Range: Deep Field<br>Signal: Locked</div>
        <div class="hud bl">Proximity: Clear</div>
        <div class="hud br">Waypoint: Deep Station &alpha;</div>

        <svg id="reticle" viewBox="0 0 70 70">
          <circle cx="35" cy="35" r="32" fill="none" stroke="#d9861f" stroke-width="0.6"/>
          <line x1="35" y1="0"  x2="35" y2="28" stroke="#d9861f" stroke-width="0.6"/>
          <line x1="35" y1="42" x2="35" y2="70" stroke="#d9861f" stroke-width="0.6"/>
          <line x1="0"  y1="35" x2="28" y2="35" stroke="#d9861f" stroke-width="0.6"/>
          <line x1="42" y1="35" x2="70" y2="35" stroke="#d9861f" stroke-width="0.6"/>
          <circle cx="35" cy="35" r="3.5" fill="none" stroke="#d9861f" stroke-width="0.7"/>
        </svg>
      </div>

      <div id="console" class="hull">

        <div id="readouts">
          <div class="readout c-amber">
            <div class="r-label">Power</div>
            <div class="r-value" id="ro-power">072%</div>
          </div>
          <div class="readout c-green">
            <div class="r-label">Signal</div>
            <div class="r-value" id="ro-signal">090%</div>
          </div>
          <div class="readout c-amber">
            <div class="r-label">Hull</div>
            <div class="r-value" id="ro-hull">100%</div>
          </div>
        </div>

        <div id="nav-row">
          <a href="members.html" class="nav-btn">
            <div class="nav-lamp"></div>
            <div class="nav-label">Members</div>
            <div class="nav-sub">crew manifest</div>
          </a>
          <a href="tracks.html" class="nav-btn">
            <div class="nav-lamp" style="animation-delay:1.1s"></div>
            <div class="nav-label">Tracks</div>
            <div class="nav-sub">audio archive</div>
          </a>
          <a href="connections.html" class="nav-btn">
            <div class="nav-lamp" style="animation-delay:2.2s"></div>
            <div class="nav-label">Connections</div>
            <div class="nav-sub">comm array</div>
          </a>
        </div>

        <div id="control-row">
          <div class="knob-cluster">
            <div class="knob-unit">
              <div class="knob" style="transform:rotate(10deg)"></div>
              <div class="knob-label">Nav</div>
            </div>
            <div class="knob-unit">
              <div class="knob" style="transform:rotate(-70deg)"></div>
              <div class="knob-label">Comm</div>
            </div>
            <div class="knob-unit">
              <div class="knob" style="transform:rotate(90deg)"></div>
              <div class="knob-label">Gain</div>
            </div>
          </div>
          <div class="toggle-cluster">
            <div class="toggle-unit is-on">
              <div class="toggle-led"></div>
              <div class="toggle is-on"><div class="toggle-lever"></div></div>
              <div class="knob-label">Auto</div>
            </div>
            <div class="toggle-unit">
              <div class="toggle-led"></div>
              <div class="toggle"><div class="toggle-lever"></div></div>
              <div class="knob-label">Beacon</div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="seam"></div>

    <!-- RIGHT WALL -->
    <div class="wall hull right">
      <div class="wall-light" style="animation-delay:0.8s;"></div>
      <div class="side-label">Nav</div>
      <div class="wall-extra tier2">
        <div class="knob-unit">
          <div class="knob" style="transform:rotate(140deg)"></div>
          <div class="knob-label">Freq</div>
        </div>
      </div>
      <div class="conduit"></div>
      <div class="wall-extra tier1 wall-light" style="animation-delay:2.1s;"></div>
    </div>

  </div><!-- /#shell -->

</div><!-- /#cockpit -->

<script>
// ═══════════════════════════════════════════════════════
// STARFIELD — canvas lives inside the window, sized to it
// ═══════════════════════════════════════════════════════
(function () {
  const win = document.getElementById('window');
  const cv = document.getElementById('starfield');
  const cx = cv.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = cv.width  = win.clientWidth;
    H = cv.height = win.clientHeight;
  }

  function makeStars() {
    stars = [];
    const n = Math.round(W * H / 1800);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.2,
        base: Math.random() * 0.7 + 0.15,
        freq: Math.random() * 0.014 + 0.003,
        phase: Math.random() * Math.PI * 2,
        vx: (Math.random() - 0.5) * 0.012,
      });
    }
  }

  let tick = 0;
  function frame() {
    cx.fillStyle = '#05060a';
    cx.fillRect(0, 0, W, H);

    tick++;
    for (const s of stars) {
      const t = Math.sin(tick * s.freq + s.phase);
      const a = s.base * (0.6 + 0.4 * t);
      cx.beginPath();
      cx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(220,225,235,${a})`;
      cx.fill();
      s.x += s.vx;
      if (s.x < 0) s.x = W;
      if (s.x > W) s.x = 0;
    }
    requestAnimationFrame(frame);
  }

  const ro = new ResizeObserver(() => { resize(); makeStars(); });
  ro.observe(win);
  resize();
  makeStars();
  frame();
})();

// ═══════════════════════════════════════════════════════
// TACTILE CONTROLS — toggles click on/off, knobs click-turn
// ═══════════════════════════════════════════════════════
(function () {
  document.querySelectorAll('.toggle').forEach(t => {
    t.addEventListener('click', () => {
      t.classList.toggle('is-on');
      const unit = t.closest('.toggle-unit');
      if (unit) unit.classList.toggle('is-on', t.classList.contains('is-on'));
    });
  });

  document.querySelectorAll('.knob').forEach(k => {
    k.addEventListener('click', () => {
      const current = k.style.transform.match(/-?\d+/);
      const deg = current ? parseInt(current[0], 10) : 0;
      k.style.transform = `rotate(${deg + 45}deg)`;
    });
  });
})();

// ═══════════════════════════════════════════════════════
// READOUT DRIFT — small live-feeling number nudges
// ═══════════════════════════════════════════════════════
(function () {
  const ids = ['ro-power', 'ro-signal', 'ro-hull'];
  setInterval(() => {
    const id = ids[Math.floor(Math.random() * ids.length)];
    const el = document.getElementById(id);
    if (!el) return;
    let val = parseInt(el.textContent, 10);
    val += Math.random() > 0.5 ? 1 : -1;
    val = Math.max(60, Math.min(100, val));
    el.textContent = String(val).padStart(3, '0') + '%';
  }, 2600);
})();
</script>
</body>
</html>
